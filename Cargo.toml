[package]
name = "override-competition"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ozton = { path = "../ozton/packages/ozton", default-features = false, features = ["control", "drivetrain", "record"] }
vexide = { version = "0.9.0-beta.1", features = ["full", "default-sdk"] }

[package.metadata.v5]
upload-strategy = "differential"
slot = 1
compress = true

[profile.release]
opt-level = 3
lto = "fat"
